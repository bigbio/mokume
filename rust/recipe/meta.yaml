{% set name = "mokume" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # For a release build, switch to the GitHub release tarball + sha256.
  # url: https://github.com/bigbio/mokume/archive/refs/tags/v{{ version }}.tar.gz
  # sha256: <FILL_IN>
  path: ../

build:
  number: 0
  # The wheel bundles a compiled PyO3 extension plus a statically linked libhdf5
  # built from C source, so the package is platform-specific and MUST NOT be
  # noarch (an abi3 extension still only supports the platform it was built on).
  script:
    - {{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  build:
    # Cross-compilation branch (e.g. osx-arm64): host tools must run on the build host.
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - maturin >=1.7,<2                       # [build_platform != target_platform]
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    # hdf5-metno's `static` feature builds libhdf5 from C source via CMake and
    # links it statically, so cmake + a make/ninja generator are mandatory.
    - cmake
    - make                                   # [unix]
    - ninja                                  # [win]
  host:
    - python
    - pip
    - maturin >=1.7,<2
  run:
    - python
    # piBAQ reads this installation's complete ProteaseDB catalog at runtime.
    - pyopenms >=3.4,<4
    # mokume.core.constants (imported by the piBAQ digest path) needs pandas.
    - pandas

test:
  imports:
    - mokume
    - mokume._mokume          # the compiled extension is present and importable
  requires:
    - pip
  commands:
    - pip check
    - python -c "import mokume; assert mokume.protease_catalog()"
    - mokume --help           # the console script dispatches through run_cli

about:
  home: https://github.com/bigbio/mokume
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Proteomics quantification toolkit — a Rust compute kernel with a Python periphery
  description: |
    mokume is a proteomics quantification toolkit (piBAQ, Top3, TopN, MaxLFQ,
    normalization, imputation, differential expression, batch correction). The
    compute-heavy kernel is implemented in Rust and exposed to Python through a
    PyO3/maturin extension (mokume._mokume); pyOpenMS supplies runtime FASTA
    digestion for piBAQ, and the optional Python periphery (plotting, tissue maps,
    interactive reports) is installable via pip extras.
  dev_url: https://github.com/bigbio/mokume
  doc_url: https://github.com/bigbio/mokume

extra:
  recipe-maintainers:
    - ypriverol
    - bigbio
