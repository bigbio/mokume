name: Python application

on:
  push:
    branches: [ main, dev ]
    paths: ["python/**", "README.md", "docs/concepts/differential-expression.md", ".github/workflows/python-app.yml", ".pre-commit-config.yaml"]
  pull_request:
    branches: [ main, dev ]
    paths: ["python/**", "README.md", "docs/concepts/differential-expression.md", ".github/workflows/python-app.yml", ".pre-commit-config.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  build:
    needs: pre-commit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge,bioconda,openms
        activate-environment: mokume
        environment-file: python/environment.yaml
        use-mamba: true

    - name: Cache conda packages
      uses: actions/cache@v4
      with:
        path: |
          ~/conda_pkgs_dir
          ~/.cache/pip
        key: ${{ runner.os }}-conda-${{ matrix.python-version }}-${{ hashFiles('python/environment.yaml', 'python/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-conda-${{ matrix.python-version }}-

    - name: Install package and dev dependencies
      shell: bash -l {0}
      run: |
        pip install pytest pytest-cov flake8
        # Install all extras so the full test suite (iBAQ, DE, imputation,
        # plotting, tissuemap, ...) has its now-optional dependencies.
        pip install -e ".[all]"

    - name: Test with pytest
      shell: bash -l {0}
      run: |
        # -s flag ensures quantification comparison tables are printed in CI logs
        pytest tests/ -v -s --tb=short --cov=mokume --cov-report=xml

    - name: Test CLI
      shell: bash -l {0}
      run: |
        mokume --help
        mokume peptides2protein --help
        mokume features2peptides --help
        mokume correct-batches --help

    - name: Test imports
      shell: bash -l {0}
      run: |
        python -c "import mokume; print(f'mokume version: {mokume.__version__}')"
        python -c "from mokume.quantification import Top3Quantification, MaxLFQQuantification"
        python -c "from mokume.quantification import DirectLFQQuantification, is_directlfq_available; print(f'DirectLFQ available: {is_directlfq_available()}')"
        python -c "from mokume.normalization.peptide import peptide_normalization"
