name: Rust

on:
  push:
    branches: [main, dev]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    branches: [main, dev]
    paths: ["rust/**", ".github/workflows/rust.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features

      - name: Test (release mode)
        run: cargo test --workspace --all-targets --release

      - name: No CJK in Rust source
        run: |
          if rg -n "\p{Han}" crates/ -g '*.rs'; then
            echo "::error::Chinese characters found in Rust source; comments and identifiers must be English."
            exit 1
          fi
