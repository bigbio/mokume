name: Python application

on:
  push:
    branches: [ main, dev ]
    paths: ["python/**", "README.md", "docs/concepts/differential-expression.md", ".github/workflows/python-app.yml", ".pre-commit-config.yaml"]
  pull_request:
    branches: [ main, dev ]
    paths: ["python/**", "README.md", "docs/concepts/differential-expression.md", ".github/workflows/python-app.yml", ".pre-commit-config.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  build:
    needs: pre-commit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Miniconda
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge,bioconda,openms
        activate-environment: mokume
        environment-file: python/environment.yaml
        use-mamba: true

    - name: Cache conda packages
      uses: actions/cache@v6
      with:
        path: |
          ~/conda_pkgs_dir
          ~/.cache/pip
        key: ${{ runner.os }}-conda-${{ matrix.python-version }}-${{ hashFiles('python/environment.yaml', 'python/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-conda-${{ matrix.python-version }}-

    - name: Install package and dev dependencies
      shell: bash -l {0}
      run: |
        pip install pytest flake8
        # Install all extras so the full test suite (DE, imputation, plotting,
        # tissuemap, ...) has its optional dependencies; piBAQ is in the base install.
        pip install -e ".[all]"

    - name: Test with pytest
      shell: bash -l {0}
      run: |
        pytest tests/ -v --tb=short

    - name: Test CLI
      shell: bash -l {0}
      run: |
        mokume --help
        mokume peptides2protein --help
        mokume features2peptides --help
        mokume correct-batches --help

    - name: Test imports
      shell: bash -l {0}
      run: |
        python -c "import mokume; print(f'mokume version: {mokume.__version__}')"
        python -c "from mokume.quantification import Top3Quantification, MaxLFQQuantification"
        python -c "from mokume.quantification import DirectLFQQuantification, is_directlfq_available; print(f'DirectLFQ available: {is_directlfq_available()}')"
        python -c "from mokume.normalization.peptide import peptide_normalization"

  batch-correction-extra:
    needs: pre-commit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install the advertised extra
        run: python -m pip install "./python[batch-correction]"
      - name: Install smoke-test support
        run: python -m pip install packaging
      - name: Run batch-correction smoke test
        env:
          MPLCONFIGDIR: ${{ runner.temp }}/matplotlib
        run: python python/tests/packaging/batch_extra_smoke.py
