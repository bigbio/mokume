# maturin build backend: compiles the `mokume-py` PyO3 crate into the
# `mokume._mokume` extension and packages it together with the Python source
# under `python/mokume/` into a `pip install mokume` wheel (the separate
# pure-Python distribution is named `mokume-py`; both import as `mokume`).
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "mokume"
description = "Proteomics quantification toolkit: a Rust compute kernel with a Python periphery"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Yufei Shen" }]
keywords = [
    "proteomics",
    "mass-spectrometry",
    "quantification",
    "pibaq",
    "differential-expression",
    "bioinformatics",
    "rust",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]
dependencies = ["pyopenms>=3.4,<4", "pandas"]

# `pip install mokume` exposes the `mokume` command; it runs the compute
# kernel in-process through the extension (no separate binary needed).
[project.scripts]
mokume = "mokume.__main__:main"

[project.urls]
Repository = "https://github.com/bigbio/mokume"
Issues = "https://github.com/bigbio/mokume/issues"

# Third-party stacks the optional Python periphery commands need. pyOpenMS is a
# base dependency because both Rust-backed piBAQ commands digest their FASTA
# through the installed runtime catalog.
# pandas is a base dependency because the piBAQ digest path imports
# mokume.core.constants, which needs it (newer pyOpenMS no longer pulls it in).
[project.optional-dependencies]
plotting = ["numpy", "pandas", "scipy", "matplotlib", "seaborn", "scikit-learn"]
reports = ["numpy", "pandas", "plotly"]
tissuemap = [
    "numpy",
    "pandas",
    "scipy",
    "duckdb>=0.10.1",
    "scanpy",
    "anndata",
    "umap-learn",
    "combat",
    "matplotlib",
    "seaborn",
    "pyarrow",
]
# QC / workflow-comparison reports + the pure-Python method fallback
# (missforest imputation) the Rust kernel does not reproduce.
analysis = ["numpy", "pandas", "scipy", "scikit-learn"]
agentic = [
    "mcp>=1.23,<2",
    "numpy",
    "pandas",
    "PyYAML>=6.0",
    "scipy",
    "scikit-learn",
    "statsmodels>=0.13",
]
all = [
    "numpy",
    "pandas",
    "scipy",
    "duckdb>=0.10.1",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "plotly",
    "scanpy",
    "anndata",
    "umap-learn",
    "combat",
    "pyarrow",
    "PyYAML",
    "mcp>=1.23,<2",
    "statsmodels>=0.13",
]

[tool.maturin]
# Build the PyO3 binding crate (not the whole workspace) and place the compiled
# extension at `mokume._mokume`; the Python package lives under `python/mokume/`.
manifest-path = "crates/mokume-py/Cargo.toml"
module-name = "mokume._mokume"
python-source = "python"
exclude = ["python/**/__pycache__/**"]

[tool.pylint.design]
# Scientific code: dataclasses aggregate many fields, helper functions take many
# tabular inputs, and analysis pipelines accumulate intermediates. The library
# defaults (5 / 7 / 15) are too tight for the periphery commands. Mirrors the
# upstream mokume package this periphery code was factored out of.
max-args = 6
max-attributes = 25
max-locals = 18
max-positional-arguments = 6

[tool.pylint."MESSAGES CONTROL"]
# C0114/0115/0116: missing module/class/function docstrings — covered by the
# documentation policy. The three behavioural checks match the upstream mokume
# package's .pylintrc.
disable = [
    "C0114",
    "C0115",
    "C0116",
    "arguments-differ",
    "unexpected-keyword-arg",
    "no-value-for-parameter",
]

[tool.bandit.assert_used]
# pytest test files use `assert` by design; B101 (assert stripped under `python
# -O`) is a production-code concern, not a test-code one.
skips = ["*/tests/*", "tests/*"]
