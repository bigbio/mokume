      mean_lodo_regret: 0.014452
      max_lodo_regret: 0.042898
      mean_lodo_rank_spearman: 0.737
    limitations:
      - Candidate preset has not been published as a Mokume default.
      - Benchmark data are 12 CPTAC clinical TMT cohorts compared tumor versus normal, quantified by Mokume
        from CDAP PSM reports with RefSeq proteins mapped to genes.
      - There is no per-gene truth; a configuration is scored by how well its calls and log2FC agree between
        two halves of the plexes of a study, after gates of at most 1% false-positive calls on null contrasts
        and a mean absolute median log2FC of at most 0.2 on tumor versus normal.
      - Without normalization (except directlfq) tumor versus normal shifted by 0.5-0.7 log2 units on
        average; both halves share such a shift, which raised their call agreement, so the shift gate
        leaves these configurations out.
      - ROTS and LimROTS were run only for configurations that can enter the ranking (no ComBat, and normalized
        unless the quantification is directlfq).
      - Configurations with batch correction, a protein filter or feature-level hierarchical normalization
        are left out because the service cannot run them; overall_best_config, the best configuration
        with them included, uses hierarchical normalization and IRS across plexes.
      - Quantification is frozen when the workflow starts from a protein matrix.
      - Leave-one-study-out selected this preset in every fold, but it was near-best in only 4 of the
        12 held-out studies (largest shortfall 0.043).
      - The CompRef cohort (cptac-compref-preset) also selected maxlfq with median normalization, but
        impseqrob imputation and LimROTS.
