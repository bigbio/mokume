      mean_lodo_regret: 0.007668
      max_lodo_regret: 0.01581
      mean_lodo_rank_spearman: 0.87
    limitations:
      - Candidate preset has not been published as a Mokume default.
      - Benchmark data are the 12 isobaric CPTAC CompRef studies (basal-like and luminal breast cancer
        xenograft reference samples), quantified by Mokume from CDAP PSM reports with RefSeq proteins
        mapped to genes.
      - There is no per-gene truth; a configuration is scored by how well its calls and log2FC agree with
        the same configuration on the other studies, after gates of at most 1% false-positive calls on
        null contrasts and a mean absolute median log2FC of at most 0.2 on the real contrast.
      - Configurations with batch correction, a protein filter or feature-level hierarchical normalization
        are left out because the service cannot run them; overall_best_config is the best configuration
        with them included.
      - Quantification is frozen when the workflow starts from a protein matrix.
      - The clinical cohort (cptac-clinical-preset) also selected maxlfq with median normalization, but
        no imputation and DEqMS.
